<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐉 龙年贪吃蛇</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0208;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

header {
  width: 100%;
  text-align: center;
  padding: 8px 0 2px;
}
header h1 {
  font-size: clamp(18px, 5vw, 30px);
  color: #FFD700;
  text-shadow: 0 0 16px rgba(255,215,0,0.7);
  letter-spacing: 4px;
}

.hud {
  display: flex;
  gap: 16px;
  padding: 4px 0 6px;
}
.hud-item {
  background: rgba(30,5,5,0.9);
  border: 1px solid rgba(255,215,0,0.35);
  border-radius: 8px;
  padding: 2px 14px;
  color: #FFD700;
  font-size: 12px;
  text-align: center;
  min-width: 60px;
}
.hud-item span { display: block; font-size: 15px; font-weight: bold; }

#gameCanvas {
  display: block;
  border: 2px solid rgba(255,215,0,0.45);
  border-radius: 4px;
  box-shadow: 0 0 30px rgba(180,0,0,0.5), 0 0 60px rgba(180,0,0,0.2);
}

#touch-controls {
  display: grid;
  grid-template-columns: 60px 60px 60px;
  grid-template-rows: 55px 55px;
  gap: 6px;
  margin-top: 8px;
}
.touch-btn {
  background: rgba(120,0,0,0.45);
  border: 1.5px solid rgba(255,215,0,0.45);
  border-radius: 10px;
  color: #FFD700;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.touch-btn:active { background: rgba(220,30,30,0.6); }
#btn-up    { grid-column: 2; grid-row: 1; }
#btn-left  { grid-column: 1; grid-row: 2; }
#btn-down  { grid-column: 2; grid-row: 2; }
#btn-right { grid-column: 3; grid-row: 2; }

.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.82);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  backdrop-filter: blur(3px);
}
.modal-overlay.hidden { display: none !important; }

.modal-box {
  background: linear-gradient(150deg, #1c0404, #2e0b00);
  border: 2px solid #FFD700;
  border-radius: 16px;
  padding: 24px 22px 20px;
  max-width: 340px;
  width: 92vw;
  text-align: center;
  box-shadow: 0 0 40px rgba(255,200,0,0.25), 0 20px 50px rgba(0,0,0,0.8);
  animation: popIn 0.28s ease;
}
@keyframes popIn {
  from { transform: scale(0.75) translateY(20px); opacity: 0; }
  to   { transform: scale(1)    translateY(0);    opacity: 1; }
}
.modal-title {
  font-size: 22px;
  color: #FFD700;
  margin-bottom: 6px;
  text-shadow: 0 0 10px rgba(255,215,0,0.5);
}
.modal-sub {
  font-size: 12px;
  color: #aaa;
  margin-bottom: 14px;
}
.rules { text-align: left; font-size: 13px; color: #c8a96e; line-height: 1.9; margin: 10px 0 16px 0; }
.rules li { margin-left: 18px; }
.dragon-icon { font-size: 48px; margin-bottom: 8px; }

.riddle-box {
  background: rgba(255,215,0,0.07);
  border: 1px solid rgba(255,215,0,0.2);
  border-radius: 10px;
  padding: 12px 14px;
  color: #f5e6c8;
  font-size: 15px;
  line-height: 1.75;
  margin-bottom: 8px;
  text-align: left;
}
.hint { color: #c8a96e; font-size: 12px; margin-bottom: 12px; }
.answer-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.ans-btn {
  background: rgba(120,0,0,0.35);
  border: 1.5px solid rgba(200,30,30,0.45);
  border-radius: 8px;
  color: #f5e6c8;
  font-size: 14px;
  padding: 10px 6px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.12s, border-color 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.ans-btn:hover { background: rgba(200,30,30,0.5); border-color: #FFD700; }
.ans-btn.correct { background: rgba(0,140,0,0.55) !important; border-color: #0f0 !important; color: #0f0 !important; }
.ans-btn.wrong   { background: rgba(160,0,0,0.65) !important; border-color: #f44 !important; color: #f88 !important; }

.modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
.mbtn {
  background: linear-gradient(135deg, #8B0000, #CC1020);
  border: none;
  border-radius: 8px;
  color: #FFD700;
  font-size: 16px;
  font-family: inherit;
  padding: 10px 22px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(139,0,0,0.5);
  transition: transform 0.15s, box-shadow 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.mbtn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(139,0,0,0.7); }
.mbtn.grey { background: linear-gradient(135deg, #333, #555); color: #ccc; }

.result-score { font-size: 42px; color: #FFD700; font-weight: bold; margin: 8px 0 4px; }
.result-sub2  { color: #aaa; font-size: 13px; }
</style>
</head>
<body>

<header><h1>🐉 龙年贪吃蛇 🐉</h1></header>

<div class="hud">
  <div class="hud-item">得分<span id="score">0</span></div>
  <div class="hud-item">最高<span id="highscore">0</span></div>
  <div class="hud-item">关卡<span id="level">1</span></div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="touch-controls">
  <button class="touch-btn" id="btn-up">&#9650;</button>
  <button class="touch-btn" id="btn-left">&#9664;</button>
  <button class="touch-btn" id="btn-down">&#9660;</button>
  <button class="touch-btn" id="btn-right">&#9654;</button>
</div>

<!-- START MODAL -->
<div class="modal-overlay" id="modal-start">
  <div class="modal-box">
    <div class="dragon-icon">&#x1F409;</div>
    <div class="modal-title">龙年贪吃蛇</div>
    <div class="modal-sub">吃汤圆、猜灯谜、过关斩将！</div>
    <ul class="rules">
      <li>&#x1F432; 控制神龙吃汤圆得分</li>
      <li>&#x1F3EF; 撞到障碍墙 &#x2192; 弹出灯谜</li>
      <li>&#x2705; 猜对灯谜 &#x2192; 继续游戏</li>
      <li>&#x274C; 猜错灯谜 &#x2192; 游戏结束</li>
      <li>&#x1F4F1; 手机可用下方方向键操作</li>
    </ul>
    <div class="modal-actions">
      <button class="mbtn" id="btn-start">开始游戏 &#x1F409;</button>
    </div>
  </div>
</div>

<!-- RIDDLE MODAL -->
<div class="modal-overlay hidden" id="modal-riddle">
  <div class="modal-box">
    <div class="modal-title">&#x1F3EE; 猜灯谜</div>
    <div class="modal-sub">撞墙了！猜对才能继续前行</div>
    <div class="riddle-box" id="riddle-q"></div>
    <div class="hint" id="riddle-hint"></div>
    <div class="answer-grid" id="riddle-opts"></div>
    <div class="modal-actions">
      <button class="mbtn grey" id="btn-giveup">放弃（游戏结束）</button>
    </div>
  </div>
</div>

<!-- RESULT MODAL -->
<div class="modal-overlay hidden" id="modal-result">
  <div class="modal-box">
    <div class="modal-title" id="result-title">游戏结束</div>
    <div class="result-score" id="result-score">0</div>
    <div class="result-sub2" id="result-sub2">分</div>
    <br>
    <div class="modal-actions">
      <button class="mbtn" id="btn-restart">再来一局 &#x1F409;</button>
    </div>
  </div>
</div>

<script>
(function () {
  var CELL = 20;
  var COLS = 19, ROWS = 21;
  var canvas = document.getElementById('gameCanvas');
  var ctx = canvas.getContext('2d');
  var snake, dir, nextDir, food, walls, wallSet;
  var score = 0, highscore = 0, level = 1;
  var alive = false, riddleActive = false;
  var loopTimer = null;
  var currentRiddle = null;

  var RIDDLES = [
    { q: "身穿红衣裳，肚里水汪汪，生的儿子多，个个黑脸膛。", hint: "(打一水果)", ans: "西瓜", opts: ["苹果", "西瓜", "石榴", "草莓"] },
    { q: "有时落在山腰，有时挂在树梢，有时像面圆镜，有时弯如镰刀。", hint: "(打一天体)", ans: "月亮", opts: ["太阳", "星星", "月亮", "彗星"] },
    { q: "麻屋子，红帐子，里面住着白胖子。", hint: "(打一食物)", ans: "花生", opts: ["花生", "莲子", "荔枝", "橙子"] },
    { q: "千条线，万条线，落入水中看不见。", hint: "(打一自然现象)", ans: "雨", opts: ["雾", "雪", "雨", "雷"] },
    { q: "生在水中，就怕水冲，一旦离水，晶莹剔透。", hint: "(打一物品)", ans: "盐", opts: ["糖", "盐", "冰", "玻璃"] },
    { q: "没有脚，没有手，背着房子到处走，有谁把它碰一碰，赶紧把头缩里头。", hint: "(打一动物)", ans: "蜗牛", opts: ["乌龟", "蜗牛", "螺蛳", "寄居蟹"] },
    { q: "小时四条腿，大时两条腿，老时三条腿。", hint: "(打一生物)", ans: "人", opts: ["狗", "猫", "人", "马"] },
    { q: "两棵小树十个杈，不长叶子不开花，能写会算还会画，天天工作是好助手。", hint: "(打一人体部位)", ans: "手", opts: ["脚", "手", "眼", "嘴"] },
    { q: "圆圆一个小饼，白白嫩嫩软绵绵，元宵节里吃一碗，甜甜蜜蜜团团圆。", hint: "(打一食品)", ans: "汤圆", opts: ["饺子", "汤圆", "元宵", "月饼"] },
    { q: "龙生九子各有异，鳞角须爪云中戏，年年岁岁望吉祥，腾云驾雾显神威。", hint: "(打一生肖)", ans: "龙", opts: ["蛇", "虎", "龙", "马"] },
    { q: "左边绿，右边红，右边怕水左边凶。", hint: "(打一植物)", ans: "辣椒", opts: ["西红柿", "辣椒", "火龙果", "草莓"] },
    { q: "一物生得真奇怪，嘴尖肚大把脚翘，背上有壳硬又圆，遇到危险往里躲。", hint: "(打一动物)", ans: "乌龟", opts: ["乌龟", "蜗牛", "螃蟹", "甲虫"] },
    { q: "红门楼，白院墙，里面住着红姑娘，见了客人笑开口，露出满口白牙床。", hint: "(打一水果)", ans: "石榴", opts: ["苹果", "石榴", "柿子", "荔枝"] },
    { q: "一间房子四面墙，只有上面没有盖，里面住了一群人，开口就把话儿讲。", hint: "(打一人体器官)", ans: "嘴", opts: ["嘴", "眼", "耳", "鼻"] },
    { q: "身形像鸡不是鸡，头戴红冠叫声脆，每天早晨第一个，高唱报晓迎朝阳。", hint: "(打一动物)", ans: "公鸡", opts: ["公鸡", "锦鸡", "鹦鹉", "喜鹊"] },
  ];

  function resizeCanvas() {
    var maxW = Math.min(window.innerWidth - 8, 400);
    var maxH = window.innerHeight - 230;
    COLS = Math.floor(maxW / CELL);
    ROWS = Math.floor(maxH / CELL);
    COLS = Math.max(15, Math.min(COLS, 21));
    ROWS = Math.max(15, Math.min(ROWS, 25));
    if (COLS % 2 === 0) COLS--;
    if (ROWS % 2 === 0) ROWS--;
    canvas.width = COLS * CELL;
    canvas.height = ROWS * CELL;
  }

  function buildWallSet(arr) {
    var s = new Set();
    for (var i = 0; i < arr.length; i++) s.add(arr[i].x + ',' + arr[i].y);
    return s;
  }

  function generateWalls(lvl) {
    var arr = [];
    for (var x = 0; x < COLS; x++) {
      for (var y = 0; y < ROWS; y++) {
        if (x === 0 || x === COLS - 1 || y === 0 || y === ROWS - 1) arr.push({ x: x, y: y });
      }
    }
    var used = buildWallSet(arr);

    function tryAdd(x, y) {
      if (x > 0 && x < COLS - 1 && y > 0 && y < ROWS - 1) {
        var k = x + ',' + y;
        if (!used.has(k)) { arr.push({ x: x, y: y }); used.add(k); }
      }
    }

    var placements = [
      { x: Math.floor(COLS * 0.25), y: Math.floor(ROWS * 0.3) },
      { x: Math.floor(COLS * 0.75), y: Math.floor(ROWS * 0.3) },
      { x: Math.floor(COLS * 0.25), y: Math.floor(ROWS * 0.7) },
      { x: Math.floor(COLS * 0.75), y: Math.floor(ROWS * 0.7) },
    ];
    var shapes = [
      function (ox, oy) { for (var i = -2; i <= 2; i++) tryAdd(ox + i, oy); },
      function (ox, oy) { for (var i = -2; i <= 2; i++) tryAdd(ox, oy + i); },
      function (ox, oy) { for (var i = 0; i < 3; i++) tryAdd(ox + i, oy); for (var i = 0; i < 3; i++) tryAdd(ox, oy + i); },
      function (ox, oy) { for (var i = -1; i <= 1; i++) { tryAdd(ox + i, oy); tryAdd(ox, oy + i); } },
    ];

    var cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
    var count = Math.min(lvl, 4);
    for (var n = 0; n < count; n++) {
      var p = placements[n];
      if (Math.abs(p.x - cx) < 4 && Math.abs(p.y - cy) < 4) continue;
      shapes[n % shapes.length](p.x, p.y);
    }
    return arr;
  }

  function isWall(x, y) { return wallSet.has(x + ',' + y); }

  function placeFood() {
    var pos, tries = 0;
    do {
      pos = { x: 1 + Math.floor(Math.random() * (COLS - 2)), y: 1 + Math.floor(Math.random() * (ROWS - 2)) };
      tries++;
    } while (tries < 500 && (isWall(pos.x, pos.y) || snake.some(function (s) { return s.x === pos.x && s.y === pos.y; })));
    food = pos;
  }

  function startGame() {
    hideModal('modal-start');
    hideModal('modal-result');
    hideModal('modal-riddle');
    resizeCanvas();
    score = 0; level = 1; alive = true; riddleActive = false;
    updateHUD();
    var mx = Math.floor(COLS / 2), my = Math.floor(ROWS / 2);
    snake = [{ x: mx, y: my }, { x: mx - 1, y: my }, { x: mx - 2, y: my }, { x: mx - 3, y: my }];
    dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
    walls = generateWalls(level);
    wallSet = buildWallSet(walls);
    placeFood();
    if (loopTimer) clearInterval(loopTimer);
    loopTimer = setInterval(tick, 140);
    draw();
  }

  function tick() {
    if (!alive || riddleActive) return;
    dir = { x: nextDir.x, y: nextDir.y };
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (isWall(head.x, head.y)) { showRiddle(); return; }
    if (snake.some(function (s) { return s.x === head.x && s.y === head.y; })) { gameOver(); return; }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10 * level;
      if (score > highscore) highscore = score;
      updateHUD();
      placeFood();
      if (score > 0 && score % (60 * level) === 0) {
        level++; updateHUD();
        walls = generateWalls(level);
        wallSet = buildWallSet(walls);
      }
    } else { snake.pop(); }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0d0208';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(255,215,0,0.04)';
    for (var x = 0; x < COLS; x++)
      for (var y = 0; y < ROWS; y++)
        ctx.fillRect(x * CELL + CELL / 2 - 1, y * CELL + CELL / 2 - 1, 2, 2);
    for (var i = 0; i < walls.length; i++) drawWall(walls[i].x, walls[i].y);
    if (food) drawTangyuan(food.x, food.y);
    if (snake && snake.length > 0) drawDragon();
  }

  function drawWall(x, y) {
    var px = x * CELL, py = y * CELL;
    var g = ctx.createLinearGradient(px, py, px + CELL, py + CELL);
    g.addColorStop(0, '#7a4200');
    g.addColorStop(0.5, '#a06000');
    g.addColorStop(1, '#5a2800');
    ctx.fillStyle = g;
    ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
    ctx.strokeStyle = 'rgba(255,160,0,0.35)';
    ctx.lineWidth = 0.8;
    ctx.strokeRect(px + 2, py + 2, CELL - 4, CELL - 4);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(px + 1, py + CELL - 4, CELL - 2, 3);
  }

  function drawTangyuan(x, y) {
    var cx = x * CELL + CELL / 2, cy = y * CELL + CELL / 2;
    var r = CELL * 0.38, t = Date.now() / 500;
    var bob = Math.sin(t) * 1.5;
    var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.2);
    glow.addColorStop(0, 'rgba(255,230,180,0.25)');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, r * 2.2, 0, Math.PI * 2); ctx.fill();
    var bg = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3 + bob, r * 0.05, cx, cy + bob, r);
    bg.addColorStop(0, '#fffaf2');
    bg.addColorStop(0.45, '#f6e8d2');
    bg.addColorStop(1, '#ddb888');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(cx, cy + bob, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(70,35,8,0.55)';
    var dots = [[0.12, -0.22], [-0.22, 0.1], [0.22, 0.2], [-0.08, -0.32]];
    for (var i = 0; i < dots.length; i++) {
      ctx.beginPath(); ctx.arc(cx + dots[i][0] * r * 2, cy + bob + dots[i][1] * r * 2, r * 0.11, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.28, cy + bob - r * 0.28, r * 0.22, r * 0.13, -0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawDragon() {
    var t = Date.now() / 220;
    for (var i = snake.length - 1; i >= 1; i--) {
      var s = snake[i];
      var px = s.x * CELL + CELL / 2, py = s.y * CELL + CELL / 2;
      var prog = i / snake.length;
      var rv = Math.floor(200 - prog * 60), gv = Math.floor(35 + prog * 25);
      var bg = ctx.createRadialGradient(px - 2, py - 2, 1, px, py, CELL * 0.44);
      bg.addColorStop(0, 'rgba(' + (rv + 40) + ',' + (gv + 55) + ',15,1)');
      bg.addColorStop(0.55, 'rgba(' + rv + ',' + gv + ',8,1)');
      bg.addColorStop(1, 'rgba(' + Math.max(0, rv - 40) + ',' + Math.max(0, gv - 20) + ',0,1)');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(px, py, CELL * 0.42, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,175,0,0.22)';
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.arc(px, py, CELL * 0.36, 0, Math.PI * 2); ctx.stroke();
      if (i % 2 === 0 && i > 0 && i < snake.length - 1) {
        var prev = snake[i - 1];
        var ang = Math.atan2(prev.y - s.y, prev.x - s.x) + Math.PI / 2;
        ctx.save();
        ctx.translate(px, py); ctx.rotate(ang);
        ctx.fillStyle = 'rgba(210,70,0,0.72)';
        ctx.beginPath();
        ctx.moveTo(-3, 0); ctx.lineTo(0, -CELL * 0.52); ctx.lineTo(3, 0);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
    var h = snake[0];
    var hx = h.x * CELL + CELL / 2, hy = h.y * CELL + CELL / 2;
    var ang2 = Math.atan2(dir.y, dir.x);
    var hglow = ctx.createRadialGradient(hx, hy, 0, hx, hy, CELL * 1.1);
    hglow.addColorStop(0, 'rgba(255,140,0,0.22)');
    hglow.addColorStop(1, 'transparent');
    ctx.fillStyle = hglow;
    ctx.beginPath(); ctx.arc(hx, hy, CELL * 1.1, 0, Math.PI * 2); ctx.fill();
    var hg = ctx.createRadialGradient(hx - 3, hy - 3, 1, hx, hy, CELL * 0.52);
    hg.addColorStop(0, '#e8a020');
    hg.addColorStop(0.5, '#c05808');
    hg.addColorStop(1, '#7a2000');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(hx, hy, CELL * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,210,40,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(hx, hy, CELL * 0.46, 0, Math.PI * 2); ctx.stroke();
    ctx.save();
    ctx.translate(hx, hy); ctx.rotate(ang2);
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.moveTo(CELL * 0.28, -CELL * 0.12); ctx.lineTo(CELL * 0.58, -CELL * 0.44); ctx.lineTo(CELL * 0.38, -CELL * 0.08); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(CELL * 0.28, CELL * 0.12); ctx.lineTo(CELL * 0.58, CELL * 0.44); ctx.lineTo(CELL * 0.38, CELL * 0.08); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,60,0.8)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(CELL * 0.38, -CELL * 0.08); ctx.quadraticCurveTo(CELL * 0.7, -CELL * 0.04, CELL * 0.9, CELL * 0.12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CELL * 0.38, CELL * 0.08); ctx.quadraticCurveTo(CELL * 0.7, CELL * 0.04, CELL * 0.9, -CELL * 0.12); ctx.stroke();
    var eyes = [-0.18, 0.18];
    for (var ei = 0; ei < eyes.length; ei++) {
      ctx.fillStyle = '#FFD700';
      ctx.beginPath(); ctx.arc(CELL * 0.12, eyes[ei] * CELL, CELL * 0.14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(CELL * 0.17, eyes[ei] * CELL, CELL * 0.07, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,40,0,0.9)';
      ctx.beginPath(); ctx.arc(CELL * 0.19, eyes[ei] * CELL - CELL * 0.02, CELL * 0.035, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#8a2a00';
    ctx.beginPath(); ctx.ellipse(CELL * 0.42, -CELL * 0.09, CELL * 0.06, CELL * 0.04, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(CELL * 0.42, CELL * 0.09, CELL * 0.06, CELL * 0.04, -0.3, 0, Math.PI * 2); ctx.fill();
    if (Math.sin(t * 2.5) > 0.6) {
      var fg = ctx.createLinearGradient(CELL * 0.48, 0, CELL * 1.15, 0);
      fg.addColorStop(0, 'rgba(255,190,0,0.85)');
      fg.addColorStop(0.5, 'rgba(255,70,0,0.55)');
      fg.addColorStop(1, 'transparent');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.moveTo(CELL * 0.48, 0);
      ctx.quadraticCurveTo(CELL * 0.85, -CELL * 0.18, CELL * 1.15, 0);
      ctx.quadraticCurveTo(CELL * 0.85, CELL * 0.18, CELL * 0.48, 0);
      ctx.fill();
    }
    ctx.restore();
  }

  function showRiddle() {
    riddleActive = true;
    draw();
    var r = RIDDLES[Math.floor(Math.random() * RIDDLES.length)];
    currentRiddle = r;
    document.getElementById('riddle-q').textContent = r.q;
    document.getElementById('riddle-hint').textContent = r.hint;
    var container = document.getElementById('riddle-opts');
    container.innerHTML = '';
    var opts = r.opts.slice().sort(function () { return Math.random() - 0.5; });
    opts.forEach(function (opt) {
      var btn = document.createElement('button');
      btn.className = 'ans-btn';
      btn.textContent = opt;
      btn.addEventListener('click', function () { checkAnswer(opt, btn); });
      container.appendChild(btn);
    });
    showModal('modal-riddle');
  }

  function checkAnswer(ans, btn) {
    document.querySelectorAll('.ans-btn').forEach(function (b) { b.style.pointerEvents = 'none'; });
    if (ans === currentRiddle.ans) {
      btn.classList.add('correct');
      setTimeout(function () {
        hideModal('modal-riddle');
        riddleActive = false;
        var safeOpts = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
        for (var i = 0; i < safeOpts.length; i++) {
          var d = safeOpts[i];
          var nx = snake[0].x + d.x, ny = snake[0].y + d.y;
          if (!isWall(nx, ny) && !snake.some(function (s) { return s.x === nx && s.y === ny; })) {
            dir = { x: d.x, y: d.y }; nextDir = { x: d.x, y: d.y }; break;
          }
        }
        draw();
      }, 900);
    } else {
      btn.classList.add('wrong');
      document.querySelectorAll('.ans-btn').forEach(function (b) {
        if (b.textContent === currentRiddle.ans) b.classList.add('correct');
      });
      setTimeout(function () { hideModal('modal-riddle'); gameOver(); }, 1300);
    }
  }

  function gameOver() {
    alive = false;
    clearInterval(loopTimer);
    if (score > highscore) highscore = score;
    updateHUD();
    document.getElementById('result-title').textContent = score >= 150 ? '🐉 真龙天子！' : score >= 80 ? '🏆 小有成就！' : '游戏结束';
    document.getElementById('result-score').textContent = score;
    document.getElementById('result-sub2').textContent = '分  |  最高分: ' + highscore;
    showModal('modal-result');
  }

  function updateHUD() {
    document.getElementById('score').textContent = score;
    document.getElementById('highscore').textContent = highscore;
    document.getElementById('level').textContent = level;
  }

  function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
  function hideModal(id) { document.getElementById(id).classList.add('hidden'); }

  function setDir(x, y) {
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x: x, y: y };
  }

  document.addEventListener('keydown', function (e) {
    var map = { 'ArrowUp': [0, -1], 'ArrowDown': [0, 1], 'ArrowLeft': [-1, 0], 'ArrowRight': [1, 0], 'w': [0, -1], 's': [0, 1], 'a': [-1, 0], 'd': [1, 0] };
    if (map[e.key]) { setDir(map[e.key][0], map[e.key][1]); e.preventDefault(); }
  });

  function addDirBtn(id, x, y) {
    var el = document.getElementById(id);
    el.addEventListener('touchstart', function (e) { e.preventDefault(); setDir(x, y); }, { passive: false });
    el.addEventListener('click', function () { setDir(x, y); });
  }
  addDirBtn('btn-up', 0, -1);
  addDirBtn('btn-down', 0, 1);
  addDirBtn('btn-left', -1, 0);
  addDirBtn('btn-right', 1, 0);

  var tx0 = 0, ty0 = 0;
  canvas.addEventListener('touchstart', function (e) { tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; }, { passive: true });
  canvas.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - tx0, dy = e.changedTouches[0].clientY - ty0;
    if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
      else setDir(0, dy > 0 ? 1 : -1);
    }
  }, { passive: true });

  // Safe button bindings after DOM is ready
  document.getElementById('btn-start').addEventListener('click', startGame);
  document.getElementById('btn-restart').addEventListener('click', startGame);
  document.getElementById('btn-giveup').addEventListener('click', function () {
    hideModal('modal-riddle');
    gameOver();
  });

  // Init
  resizeCanvas();
  ctx.fillStyle = '#0d0208';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

})();
</script>
</body>
</html>
